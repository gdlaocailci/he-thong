<style>
    .bg-menu-main { background-color: #0b5394; } /* Màu nền xanh dương đậm bám sát ảnh gốc */
    .bg-menu-hover { background-color: #1e70b8; } /* Màu nền khi hover hoặc tab đang chọn */
    .text-menu-active { color: #b6d7a8; } /* Màu chữ xanh mạ nhạt của tab đang chọn */
    .border-menu-active { border-color: #b6d7a8; } /* Viền trái của tab đang chọn */
</style>

<!-- KHỐI CHÍNH CỦA MENU DỌC -->
<div class="w-64 h-full min-h-screen bg-menu-main flex flex-col shadow-xl font-sans text-white">
    
    <!-- Phần 1: Logo và Tên trường -->
    <div class="flex flex-col items-center pt-8 pb-3 px-4">
        <div class="bg-white p-1 rounded-full mb-4 shadow-lg border-2 border-blue-300">
            <!-- Icon Calendar mặc định, sẽ được cập nhật bởi dữ liệu cấu hình -->
            <img id="logoMenuDoc" src="https://www.svgrepo.com/show/339459/calendar.svg" alt="Logo Hệ thống" class="w-20 h-20 rounded-full object-cover">
        </div>
        <h2 id="tenDonViMenu" class="text-center text-white font-bold text-base uppercase tracking-wide leading-relaxed">
            Trường Tiểu học<br>Hợp Thành
        </h2>
    </div>

    <!-- Đường kẻ ngang phân cách đứt đoạn -->
    <div class="px-6 my-2">
        <hr class="border-dashed border-blue-300 opacity-40">
    </div>

    <!-- Phần 2: Khối thông tin Năm học & Tuần học (mô phỏng khối trắng trong ảnh) -->
    <div class="mx-5 my-4 bg-white rounded shadow-md p-4 text-sm text-slate-800">
        <div class="flex flex-col mb-3 border-b border-dashed border-gray-300 pb-3">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold">Năm học:</span>
                <span id="menuHienThiNamHoc" class="font-bold text-blue-600 text-right">Đang tải...</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="font-bold">Tuần học:</span>
                <span id="menuHienThiTuanHoc" class="font-bold text-blue-600 text-right">Đang tải...</span>
            </div>
        </div>
        <div class="text-center">
            <span class="font-bold">Trạng thái:</span><br>
            <span class="font-bold text-red-600 text-base mt-1 inline-block">Hệ thống mở</span>
        </div>
    </div>

    <!-- Phần 3: Danh sách các Tab Menu -->
    <nav class="flex flex-col mt-4">
        <!-- Tab 1: TKB Toàn trường (Mặc định được chọn) -->
        <a href="#" class="flex items-center gap-4 px-6 py-4 bg-menu-hover border-l-[5px] border-menu-active transition-all cursor-pointer border-b border-white/10">
            <img src="https://www.svgrepo.com/show/521634/file-table.svg" class="w-5 h-5 filter invert brightness-0" alt="Toàn trường">
            <span class="font-bold text-menu-active text-[15px]">TKB Toàn trường</span>
        </a>

        <!-- Tab 2: TKB Cá nhân -->
        <a href="#" class="flex items-center gap-4 px-6 py-4 hover:bg-menu-hover border-l-[5px] border-transparent transition-all cursor-pointer border-b border-white/10 group">
            <img src="https://www.svgrepo.com/show/521743/person.svg" class="w-5 h-5 filter invert brightness-0 opacity-80 group-hover:opacity-100 transition-opacity" alt="Cá nhân">
            <span class="font-bold text-white group-hover:text-menu-active transition-colors text-[15px]">TKB Cá nhân</span>
        </a>

        <!-- Tab 3: Thống kê -->
        <a href="#" class="flex items-center gap-4 px-6 py-4 hover:bg-menu-hover border-l-[5px] border-transparent transition-all cursor-pointer border-b border-white/10 group">
            <img src="https://www.svgrepo.com/show/521566/chart-pie.svg" class="w-5 h-5 filter invert brightness-0 opacity-80 group-hover:opacity-100 transition-opacity" alt="Thống kê">
            <span class="font-bold text-white group-hover:text-menu-active transition-colors text-[15px]">Thống kê</span>
        </a>
    </nav>
    
    <!-- Phần cuối (Footer menu) -->
    <div class="mt-auto p-4 bg-black/20 text-center">
        <p class="text-xs text-blue-200 font-bold uppercase tracking-widest">Thiết kế và phát triển</p>
        <p class="text-sm font-bold text-white mt-1">Hoàng Ngọc Lâm</p>
    </div>
</div>
