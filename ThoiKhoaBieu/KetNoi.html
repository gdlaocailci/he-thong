<script>
    const KET_NOI_MAY_CHU = {
        // Thầy dán URL Web App (Deploy) của Apps Script vào đây
        duongDanAPI: "https://script.google.com/macros/s/AKfycbz1IOFWbcOTfgPmnaSeD2uU0i7UWWsUSW3pHja87WzT3GOhtwsJz7YyNdY2eOHGU33s/exec", 
        
        maDinhDanh: "TH_HOP_THANH_2025_2026",

        khoiTaoGoiDuLieu: function(lenhThucThi, thongTinBoSung = {}) {
            let duLieuGoi = {
                maDinhDanh: this.maDinhDanh,
                lenh: lenhThucThi,
                duLieu: thongTinBoSung
            };
            return {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(duLieuGoi)
            };
        },

        layDuLieu: async function(lenhYeuCau) {
            try {
                let phanHoi = await fetch(this.duongDanAPI, this.khoiTaoGoiDuLieu(lenhYeuCau));
                let ketQua = await phanHoi.json();
                return ketQua;
            } catch (loiHeThong) {
                console.error("Lỗi giao tiếp máy chủ:", loiHeThong);
                return { trangThai: "Loi", thongBao: "Mất kết nối đến hệ thống dữ liệu." };
            }
        }
    };
</script>
