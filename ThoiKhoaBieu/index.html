<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thời Khóa Biểu Trực Tuyến</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hieu-ung-mo-dan {
            animation: moDanHienThi 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            filter: blur(8px);
            transform: translateY(15px);
        }
        @keyframes moDanHienThi {
            to { opacity: 1; filter: blur(0); transform: translateY(0); }
        }
        .tre-100 { animation-delay: 100ms; }
        .tre-200 { animation-delay: 200ms; }
        .tre-300 { animation-delay: 300ms; }
        
        /* Cấu hình đặc dụng cho bảng lưới giống Excel */
        .bang-excel {
            border-collapse: collapse;
            width: 100%;
        }
        .bang-excel th, .bang-excel td {
            border: 1px solid #718096; /* Viền xám đậm chuẩn hành chính */
            padding: 4px 8px;
            font-size: 0.85rem;
            white-space: normal;
            word-wrap: break-word;
        }
        .bang-excel th {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans p-2 md:p-6 min-h-screen">

    <!-- HEADER -->
    <header class="bg-white shadow-sm border border-gray-300 p-4 mb-4 flex flex-col md:flex-row items-center justify-between hieu-ung-mo-dan tre-100">
        <div class="flex items-center space-x-4 mb-4 md:mb-0">
            <img id="logoHeThong" src="" alt="Logo" class="w-12 h-12 hidden">
            <div>
                <h1 id="tenHeThong" class="text-xl font-bold text-blue-900 uppercase tracking-wide">Đang nạp dữ liệu...</h1>
                <p id="tenDonVi" class="text-gray-600 font-semibold">Trường Tiểu học</p>
            </div>
        </div>
        
        <div class="text-center md:text-right border-l-0 md:border-l-2 border-gray-200 md:pl-4">
            <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Năm học - Niên khóa</p>
            <p class="font-bold text-blue-800"><span id="hienThiNamHoc">...</span></p>
            <p class="font-bold text-gray-700 mt-1">Tuần chuyên môn: <span id="hienThiTuan" class="text-blue-800 text-lg">...</span></p>
        </div>
    </header>

    <!-- MAIN BẢNG DỮ LIỆU CHUẨN FORM EXCEL -->
    <main class="hieu-ung-mo-dan tre-200">
        <div class="bg-white shadow-md border border-gray-400 overflow-hidden">
            <div class="p-3 bg-gray-50 border-b border-gray-400 flex justify-between items-center">
                <h2 class="text-base font-bold text-black flex items-center gap-2">
                    <img id="iconBang" src="" alt="Icon Bảng" class="w-5 h-5 hidden">
                    <span>THỜI KHÓA BIỂU TOÀN TRƯỜNG</span>
                </h2>
                <button onclick="taiDuLieuTKB()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 text-sm shadow transition duration-200 flex items-center gap-2">
                    Làm mới dữ liệu
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="bang-excel">
                    <!-- Javascript sẽ tự động bơm 2 dòng tiêu đề (colspan) vào đây -->
                    <thead id="tieuDeBang">
                        <tr>
                            <th class="text-center">Đang phân tích định dạng biểu mẫu...</th>
                        </tr>
                    </thead>
                    <tbody id="vungHienThiDuLieu">
                        <tr>
                            <td class="px-6 py-12 text-center text-gray-500">
                                <div class="w-6 h-6 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-2"></div>
                                <p>Đang kết nối API...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-6 text-center text-gray-600 hieu-ung-mo-dan tre-300">
        <p id="tieuDeTacGia" class="text-xs font-semibold uppercase tracking-widest"></p>
        <p id="tenTacGia" class="text-sm font-extrabold"></p>
    </footer>

    <!-- LIÊN KẾT JS -->
    <script src="KetNoi.js"></script>
    <script src="app.js"></script>
</body>
</html>
